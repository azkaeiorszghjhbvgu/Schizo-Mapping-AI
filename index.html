<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Romania Map Pathfinding</title>

  <link rel="stylesheet" href="css/landing.css" />

</head>

<body>

  <nav class="nav">

    <a href="index.html">Schizo Mapping</a>

    <div>

      <a href="app.html">Visualizer</a>

      <a
        href="https://github.com/azkaeiorszghjhbvgu/Schizo-Mapping-AI"
        target="_blank"
      >
        GitHub ↗
      </a>

    </div>

  </nav>


  <main class="hero">

    <section class="copy">

      <p class="eyebrow">AI SEARCH STUDY · ROMANIA</p>

      <h1>
        Romania
        <span>Map Pathfinding</span>
      </h1>

      <p class="description">
        Compare blind search and heuristic search
      </p>

      <p class="methods">
        UCS · A* Search (Fruit Fly Scent)
      </p>

      <a href="app.html" class="cta">
        Explore the Map →
      </a>

    </section>


    <section class="visual">

      <img
        id="cityImage"
        src="assets/romania.jpeg"
        alt="Romanian city"
      />

      <button class="image-btn prev" onclick="prevImage()">←</button>

      <button class="image-btn next" onclick="nextImage()">→</button>

    </section>

  </main>


  <script>

    const images = [
      "assets/romania.jpeg",
      "assets/romania2.jpeg",
      "assets/romania3.jpeg"
    ];

    let currentImage = 0;


    function nextImage() {

      currentImage++;

      if (currentImage >= images.length) {
        currentImage = 0;
      }

      document.getElementById("cityImage").src = images[currentImage];
    }


    function prevImage() {

      currentImage--;

      if (currentImage < 0) {
        currentImage = images.length - 1;
      }

      document.getElementById("cityImage").src = images[currentImage];
    }

  </script>

</body>

</html>
