<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Romania Map Pathfinding</title>

  <link rel="stylesheet" href="css/landing.css" />

</head>

<body>

  <nav class="nav">

    <a href="index.html">Schizo Mapping</a>

    <div>

      <a href="app.html">Visualizer</a>

      <a
        href="https://github.com/azkaeiorszghjhbvgu/Schizo-Mapping-AI"
        target="_blank"
      >
        GitHub ↗
      </a>

    </div>

  </nav>


  <main class="hero">

    <section class="copy">

      <p class="eyebrow">AI SEARCH STUDY · ROMANIA</p>

      <h1>
        Romania
        <span>Map Pathfinding</span>
      </h1>

      <p class="description">
        Compare blind search and heuristic search
      </p>

      <p class="methods">
        UCS · A* Search (Fruit Fly Scent)
      </p>

      <a href="app.html" class="cta">
        Explore the Map →
      </a>

    </section>


    <section class="visual">
      <div class="image-container">
        <div class="image-track" id="imageTrack">
          <img src="assets/romania.jpeg" alt="Romania city" />
          <img src="assets/romania2.jpeg" alt="Romania city" />
          <img src="assets/romania3.jpeg" alt="Romania city" />
        </div>
      <button class="image-btn prev" onclick="changeImage(-1)">←</button>
      <button class="image-btn next" onclick="changeImage(1)">→</button>
      </div>
    </section>

  </main>


  <script>

    const images = [
      "assets/romania.jpeg",
      "assets/romania2.jpeg",
      "assets/romania3.jpeg"
    ];

    let currentImage = 0;
    let autoPlayTimer = null;


    function changeImage(direction) {
      currentImage += direction;

      if (currentImage >= images.length) {
        currentImage = 0;
      } else if (currentImage < 0) {
        currentImage = images.length - 1;
      }

      const track = document.getElementById("imageTrack");
      track.style.transform = `translateX(-${currentImage * 100}%)`;

      resetTimer();
    }

    function resetTimer() {
      clearInterval(autoPlayTimer);
      autoPlayTimer = setInterval(() => {
        changeImage(1);
      }, 3000);
    }

    resetTimer();
    
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        document.body.style.animation = "none";
        document.body.classList.remove("fade-out");
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const ctaButton = document.querySelector(".cta");

      if (ctaButton) {
        ctaButton.addEventListener("click", (e) => {
          e.preventDefault();
          const targetUrl = ctaButton.getAttribute("href");

          document.body.style.animation = "none";

          void document.body.offsetHeight;
          
          document.body.classList.add("fade-out");

          setTimeout(() => {
            window.location.href = targetUrl;
          }, 400);
        });
      }
    });

  </script>

</body>

</html>
